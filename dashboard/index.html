<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immortal Software — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0A0A0A;
  --surface:      #111118;
  --surface-2:    #1a1a28;
  --surface-3:    #22203a;
  --border:       rgba(168,85,247,.18);
  --border-2:     rgba(168,85,247,.08);
  --accent:       #A855F7;
  --accent-dim:   #7C3AED;
  --accent-glow:  rgba(168,85,247,.22);
  --accent-soft:  rgba(168,85,247,.10);
  --text:         #F0EDF8;
  --text-2:       #9A92B0;
  --text-3:       #5e5a78;
  --success:      #22C55E;
  --success-bg:   rgba(34,197,94,.12);
  --warning:      #EAB308;
  --warning-bg:   rgba(234,179,8,.12);
  --danger:       #EF4444;
  --danger-bg:    rgba(239,68,68,.12);
  --info:         #38BDF8;
  --info-bg:      rgba(56,189,248,.10);
  --sidebar-w:    240px;
  --radius:       10px;
}

html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
}

.sidebar-brand {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  box-shadow: 0 0 16px var(--accent-glow);
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.brand-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .05em;
  color: var(--text);
}
.brand-sub {
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: .08em;
  text-transform: uppercase;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 0;
  overflow-y: auto;
}

.nav-section {
  padding: 0 12px;
  margin-bottom: 8px;
}
.nav-label {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 8px 8px 4px;
  font-weight: 600;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 7px;
  color: var(--text-2);
  cursor: pointer;
  transition: all .15s;
  border: 1px solid transparent;
  font-size: 13.5px;
  font-weight: 500;
  user-select: none;
}
.nav-item:hover {
  background: var(--accent-soft);
  color: var(--text);
  border-color: var(--border);
}
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--border);
}
.nav-item.active .nav-icon { color: var(--accent); }
.nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 20px;
  min-width: 18px;
  text-align: center;
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border-2);
}

.admin-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--border-2);
}

.admin-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}

.admin-info { flex: 1; min-width: 0; }
.admin-name { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-role { font-size: 10px; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }

.logout-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-3); font-size: 14px;
  transition: color .15s; padding: 2px;
}
.logout-btn:hover { color: var(--danger); }

/* ── MAIN ── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  height: 60px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
  position: sticky; top: 0; z-index: 50;
}

.topbar-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 17px;
  flex: 1;
}

.topbar-actions { display: flex; align-items: center; gap: 10px; }

.icon-btn {
  width: 34px; height: 34px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--text-2);
  transition: all .15s;
}
.icon-btn:hover { background: var(--accent-soft); border-color: var(--border); color: var(--accent); }

.status-dot {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-2);
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; } 50% { opacity: .5; }
}

.content {
  flex: 1;
  padding: 28px;
  overflow-x: hidden;
}

/* ── STATS GRID ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: border-color .2s;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-dim));
  opacity: 0;
  transition: opacity .2s;
}
.stat-card:hover { border-color: var(--border); }
.stat-card:hover::before { opacity: 1; }

.stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.stat-label { font-size: 12px; color: var(--text-2); font-weight: 500; letter-spacing: .03em; }
.stat-icon {
  width: 32px; height: 32px;
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}

.stat-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.stat-change {
  font-size: 11.5px;
  font-weight: 500;
  display: flex; align-items: center; gap: 3px;
}
.stat-change.up { color: var(--success); }
.stat-change.down { color: var(--danger); }
.stat-change.neutral { color: var(--text-3); }

/* ── PANELS ── */
.panels-row {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 16px;
  margin-bottom: 24px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  overflow: hidden;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-2);
}
.panel-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 14px;
}
.panel-actions { display: flex; gap: 8px; align-items: center; }

/* ── TABLE ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 10px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-3);
  border-bottom: 1px solid var(--border-2);
  white-space: nowrap;
}
tbody tr {
  border-bottom: 1px solid var(--border-2);
  transition: background .1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface-2); }
tbody td {
  padding: 11px 16px;
  font-size: 13px;
  color: var(--text-2);
  white-space: nowrap;
}
tbody td:first-child { color: var(--text); font-weight: 500; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
}
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
.badge-info    { background: var(--info-bg);     color: var(--info); }
.badge-purple  { background: var(--accent-soft); color: var(--accent); }

.role-badge {
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px;
}
.role-owner  { background: rgba(168,85,247,.25); color: #d8b4fe; }
.role-admin  { background: rgba(168,85,247,.15); color: var(--accent); }
.role-user   { background: var(--surface-3); color: var(--text-2); }

/* ── EVENT FEED ── */
.event-list { display: flex; flex-direction: column; }
.event-item {
  display: flex;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-2);
  align-items: flex-start;
}
.event-item:last-child { border-bottom: none; }
.event-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; margin-top: 5px;
}
.event-body { flex: 1; min-width: 0; }
.event-msg { font-size: 12.5px; color: var(--text); line-height: 1.4; }
.event-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ── GENERATE PANEL ── */
.gen-panel {
  margin-bottom: 24px;
}
.gen-form {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr) auto;
  gap: 12px;
  align-items: end;
}

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .04em; text-transform: uppercase; }
.field select,
.field input {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 7px;
  color: var(--text);
  padding: 8px 12px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color .15s;
  appearance: none;
}
.field select:focus,
.field input:focus { border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  border: none;
  transition: all .15s;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
  color: #fff;
  box-shadow: 0 0 16px var(--accent-glow);
}
.btn-primary:hover {
  box-shadow: 0 0 24px var(--accent-glow);
  transform: translateY(-1px);
}
.btn-ghost {
  background: var(--surface-2);
  color: var(--text-2);
  border: 1px solid var(--border-2);
}
.btn-ghost:hover { background: var(--surface-3); color: var(--text); border-color: var(--border); }
.btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,.2); }
.btn-danger:hover { background: rgba(239,68,68,.2); }

/* ── KEY OUTPUT ── */
.key-output {
  margin: 0 20px 20px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.key-output-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.key-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 180px;
  overflow-y: auto;
}
.key-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  background: var(--surface);
  border-radius: 6px;
  border: 1px solid var(--border-2);
}
.key-text {
  font-family: 'Space Grotesk', monospace;
  font-size: 13px;
  letter-spacing: .1em;
  color: var(--accent);
}
.copy-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-3); font-size: 13px; padding: 2px 4px;
  border-radius: 4px; transition: all .1s;
}
.copy-btn:hover { color: var(--accent); background: var(--accent-soft); }
.copy-btn.copied { color: var(--success); }

/* ── LOGIN SCREEN ── */
#login-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.login-card {
  width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  box-shadow: 0 0 60px rgba(168,85,247,.12);
}
.login-logo-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; margin-bottom: 32px;
}
.login-logo {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 0 30px var(--accent-glow);
}
.login-brand {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: .04em;
  text-align: center;
}
.login-brand span { color: var(--accent); }
.login-sub { font-size: 12px; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; text-align: center; }

.login-field { margin-bottom: 14px; }
.login-field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
.login-field input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color .15s;
}
.login-field input:focus { border-color: var(--accent); }

.login-btn {
  width: 100%;
  padding: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  border: none;
  border-radius: 8px;
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .04em;
  cursor: pointer;
  box-shadow: 0 0 20px var(--accent-glow);
  transition: all .2s;
  margin-top: 8px;
}
.login-btn:hover { box-shadow: 0 0 32px var(--accent-glow); transform: translateY(-1px); }
.login-err { color: var(--danger); font-size: 12px; margin-top: 10px; text-align: center; min-height: 16px; }
.login-api-note {
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border-2);
  font-size: 11px; color: var(--text-3); text-align: center;
}
.login-api-note input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  color: var(--text-2);
  padding: 7px 10px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  outline: none;
  margin-top: 6px;
  transition: border-color .15s;
}
.login-api-note input:focus { border-color: var(--border); }

/* ── MISC ── */
.hidden { display: none !important; }
.tag { font-size: 11px; color: var(--text-3); }

/* scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo">⚔️</div>
      <div>
        <div class="login-brand"><span>IMMORTAL</span> SOFTWARE</div>
        <div class="login-sub">Admin Dashboard</div>
      </div>
    </div>
    <div class="login-field">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="admin" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="login-submit">ENTER DASHBOARD</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-api-note">
      <div>API Endpoint</div>
      <input type="text" id="api-url-input" placeholder="http://localhost:3000" value="http://localhost:3000">
    </div>
  </div>
</div>

<!-- ── APP SHELL ── -->
<div id="app-shell" class="hidden" style="display:none; width:100%;">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">⚔️</div>
    <div class="brand-text">
      <div class="brand-name">IMMORTAL</div>
      <div class="brand-sub">Admin Panel</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-label">Overview</div>
      <div class="nav-item active" data-view="dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Licensing</div>
      <div class="nav-item" data-view="licenses">
        <span class="nav-icon">🔑</span> Licenses
        <span class="nav-badge" id="nav-badge-lic">—</span>
      </div>
      <div class="nav-item" data-view="generate">
        <span class="nav-icon">✨</span> Generate Keys
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Users</div>
      <div class="nav-item" data-view="users">
        <span class="nav-icon">👥</span> Users
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Security</div>
      <div class="nav-item" data-view="events">
        <span class="nav-icon">🛡️</span> Audit Log
        <span class="nav-badge" id="nav-badge-ev">—</span>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-label">System</div>
      <div class="nav-item" data-view="products">
        <span class="nav-icon">📦</span> Products
      </div>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-chip">
      <div class="admin-avatar" id="sidebar-avatar">A</div>
      <div class="admin-info">
        <div class="admin-name" id="sidebar-name">admin</div>
        <div class="admin-role" id="sidebar-role">OWNER</div>
      </div>
      <button class="logout-btn" id="logout-btn" title="Sign out">⏻</button>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-actions">
      <div class="status-dot">
        <div class="dot" id="api-dot"></div>
        <span id="api-status-txt">Live</span>
      </div>
      <button class="icon-btn" id="refresh-btn" title="Refresh">🔄</button>
    </div>
  </div>

  <div class="content" id="main-content">
    <!-- content injected by JS -->
  </div>
</div>

</div><!-- /#app-shell -->

<script>
const VIEWS = {
  dashboard: 'Dashboard',
  licenses: 'Licenses',
  generate: 'Generate Keys',
  users: 'Users',
  events: 'Audit Log',
  products: 'Products & Plans',
};

// ── State ──────────────────────────────────────────────────
let API = 'http://localhost:3000';
let accessToken = '';
let currentView = 'dashboard';
let cache = {};

// ── Auth helpers ───────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${accessToken}`,
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) { doLogout(); return null; }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// ── Login ──────────────────────────────────────────────────
document.getElementById('login-submit').addEventListener('click', async () => {
  const btn = document.getElementById('login-submit');
  const err = document.getElementById('login-err');
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  API = (document.getElementById('api-url-input').value.trim() || 'http://localhost:3000').replace(/\/$/, '');
  err.textContent = '';
  if (!user || !pass) { err.textContent = 'Enter credentials'; return; }
  btn.textContent = 'CONNECTING…'; btn.disabled = true;
  try {
    const data = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass }),
    }).then(r => r.json());
    if (!data.accessToken) throw new Error(data.error || 'Login failed');
    accessToken = data.accessToken;
    localStorage.setItem('immortal_admin_token', accessToken);
    bootDashboard(user, data.role || 'ADMIN');
  } catch (e) {
    err.textContent = e.message === 'Failed to fetch' ? 'Cannot reach API — check endpoint' : e.message;
    btn.textContent = 'ENTER DASHBOARD'; btn.disabled = false;
  }
});

// Allow Enter key to submit
['login-user', 'login-pass'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-submit').click();
  })
);

function bootDashboard(username, role) {
  document.getElementById('login-screen').classList.add('hidden');
  const shell = document.getElementById('app-shell');
  shell.classList.remove('hidden');
  shell.style.display = 'flex';
  document.getElementById('sidebar-name').textContent = username;
  document.getElementById('sidebar-avatar').textContent = username[0].toUpperCase();
  document.getElementById('sidebar-role').textContent = role;
  navigateTo('dashboard');
  pingApi();
  setInterval(pingApi, 30000);
}

async function pingApi() {
  try {
    await fetch(`${API}/health`);
    document.getElementById('api-dot').style.background = 'var(--success)';
    document.getElementById('api-dot').style.boxShadow = '0 0 6px var(--success)';
    document.getElementById('api-status-txt').textContent = 'Live';
  } catch {
    document.getElementById('api-dot').style.background = 'var(--danger)';
    document.getElementById('api-dot').style.boxShadow = '0 0 6px var(--danger)';
    document.getElementById('api-status-txt').textContent = 'Offline';
  }
}

function doLogout() {
  apiFetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
  accessToken = '';
  localStorage.removeItem('immortal_admin_token');
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').textContent = '';
}

document.getElementById('logout-btn').addEventListener('click', doLogout);
document.getElementById('refresh-btn').addEventListener('click', () => { cache = {}; navigateTo(currentView); });

// ── Navigation ─────────────────────────────────────────────
document.querySelectorAll('.nav-item[data-view]').forEach(el => {
  el.addEventListener('click', () => navigateTo(el.dataset.view));
});

function navigateTo(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  document.getElementById('topbar-title').textContent = VIEWS[view] || view;
  const el = document.getElementById('main-content');
  el.innerHTML = '<div style="color:var(--text-3);padding:40px;text-align:center">Loading…</div>';
  RENDERERS[view]?.();
}

// ── Badge updater ──────────────────────────────────────────
async function updateBadges() {
  try {
    const stats = await apiFetch('/api/admin/stats');
    if (!stats) return;
    document.getElementById('nav-badge-lic').textContent = stats.activeLicenses ?? '—';
    document.getElementById('nav-badge-ev').textContent = stats.recentEvents ?? '—';
  } catch {}
}

// ── Dashboard View ─────────────────────────────────────────

  <div class="stats-grid">

    <div class="stat-card">

        <span class="stat-label">Active Licenses</span>

      </div>
      <div class="stat-value">${fmt(stats.activeLicenses)}</div>
      <div class="stat-change up">↑ Valid & in-use</div>
    </div>
    <div class="stat-card">
      <div class="stat-header">
        <span class="stat-label">Total Keys</span>
        <div class="stat-icon">🔑</div>

    <div class="stat-card">

        <span class="stat-label">Security Events</span>
        <div class="stat-icon">🛡️</div>
      </div>
      <div class="stat-value">${fmt(stats.recentEvents)}</div>
      <div class="stat-change neutral">Last 24 hours</div>
    </div>
  </div>

  <div class="panels-row">

// ── Licenses View ──────────────────────────────────────────
async function renderLicenses() {
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="panel"><div class="panel-header"><span class="panel-title">All Licenses</span></div><div class="table-wrap" id="lic-table"><div style="padding:24px;color:var(--text-3)">Loading…</div></div></div>`;
  try {
    const data = await apiFetch('/api/admin/licenses?limit=50');
    document.getElementById('lic-table').innerHTML = licenseTable(data?.licenses || [], true);
    attachLicenseActions();
  } catch (e) {
    document.getElementById('lic-table').innerHTML = `<div style="padding:16px;color:var(--text-3)">${e.message}</div>`;
  }
}

function licenseTable(licenses, full = false) {
  if (!licenses.length) return '<div style="padding:24px;color:var(--text-3);text-align:center">No licenses found</div>';
  const rows = licenses.map(l => `
    <tr>
      <td><span style="font-family:monospace;font-size:12px;color:var(--accent)">${l.keyPrefix || '????'}‑••••‑••••‑••••‑••••</span></td>
      <td><span class="badge badge-${statusColor(l.status)}">${l.status}</span></td>
      <td>${l.product?.name || '—'}</td>
      <td>${l.plan?.name || '—'}</td>
      <td>${l.holder?.username || '<span style="color:var(--text-3)">Unbound</span>'}</td>
      <td>${fmtDate(l.expiresAt)}</td>
      ${full ? `<td><div style="display:flex;gap:6px">
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" data-action="reset-devices" data-id="${l.id}">Reset Devices</button>
        <button class="btn btn-danger" style="padding:4px 10px;font-size:11px" data-action="revoke" data-id="${l.id}">Revoke</button>
      </div></td>` : ''}
    </tr>`).join('');
  return `<table><thead><tr>
    <th>Key</th><th>Status</th><th>Product</th><th>Plan</th><th>Holder</th><th>Expires</th>
    ${full ? '<th>Actions</th>' : ''}
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function attachLicenseActions() {
  document.querySelectorAll('[data-action="revoke"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Revoke this license?')) return;
      try {
        await apiFetch(`/api/licenses/${btn.dataset.id}/revoke`, { method: 'POST' });
        cache = {}; renderLicenses();
      } catch (e) { alert(e.message); }
    });
  });
  document.querySelectorAll('[data-action="reset-devices"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await apiFetch(`/api/licenses/${btn.dataset.id}/reset-devices`, { method: 'POST' });
        alert('Devices reset successfully');
      } catch (e) { alert(e.message); }
    });
  });
}

// ── Generate View ──────────────────────────────────────────
async function renderGenerate() {
  const el = document.getElementById('main-content');
  let products = [], plans = [];
  try { products = (await apiFetch('/api/admin/products'))?.products || []; } catch {}

  el.innerHTML = `
  <div class="panel gen-panel">
    <div class="panel-header">
      <span class="panel-title">Generate License Keys</span>
    </div>
    <div class="gen-form">
      <div class="field">
        <label>Product</label>
        <select id="gen-product">
          <option value="">Select product…</option>
          ${products.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Plan</label>
        <select id="gen-plan" disabled><option value="">Select product first</option></select>
      </div>
      <div class="field">
        <label>Quantity (max 50)</label>
        <input type="number" id="gen-qty" value="1" min="1" max="50">
      </div>
      <button class="btn btn-primary" id="gen-btn">✨ Generate</button>
    </div>
    <div id="gen-output" class="hidden key-output">
      <div class="key-output-title">Generated Keys — Click to copy</div>
      <div class="key-list" id="gen-key-list"></div>
    </div>
  </div>`;

  document.getElementById('gen-product').addEventListener('change', async function() {
    const pid = this.value;
    const planSel = document.getElementById('gen-plan');
    if (!pid) { planSel.innerHTML = '<option>Select product first</option>'; planSel.disabled = true; return; }
    planSel.disabled = false;
    try {
      plans = (await apiFetch('/api/admin/products'))?.products?.find(p => p.id === pid)?.plans || [];
      planSel.innerHTML = plans.map(p => `<option value="${p.id}">${p.name} (${p.durationDays}d)</option>`).join('');
    } catch { planSel.innerHTML = '<option>Error loading plans</option>'; }
  });

  document.getElementById('gen-btn').addEventListener('click', async () => {
    const productId = document.getElementById('gen-product').value;
    const planId = document.getElementById('gen-plan').value;
    const qty = parseInt(document.getElementById('gen-qty').value) || 1;
    const btn = document.getElementById('gen-btn');
    if (!productId || !planId) { alert('Select a product and plan'); return; }
    btn.textContent = 'Generating…'; btn.disabled = true;
    try {
      const data = await apiFetch('/api/licenses', {
        method: 'POST',
        body: JSON.stringify({ productId, planId, quantity: Math.min(qty, 50) }),
      });
      const keys = data?.keys || [];
      const list = document.getElementById('gen-key-list');
      list.innerHTML = keys.map(k => `
        <div class="key-item">
          <span class="key-text">${k}</span>
          <button class="copy-btn" data-key="${k}" title="Copy">📋</button>
        </div>`).join('');
      document.getElementById('gen-output').classList.remove('hidden');
      list.querySelectorAll('.copy-btn').forEach(b => {
        b.addEventListener('click', () => {
          navigator.clipboard.writeText(b.dataset.key).then(() => {
            b.textContent = '✅'; b.classList.add('copied');
            setTimeout(() => { b.textContent = '📋'; b.classList.remove('copied'); }, 1500);
          });
        });
      });
    } catch (e) { alert('Error: ' + e.message); }
    btn.textContent = '✨ Generate'; btn.disabled = false;
  });
}

// ── Users View ─────────────────────────────────────────────
async function renderUsers() {
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="panel"><div class="panel-header"><span class="panel-title">Users</span></div><div class="table-wrap" id="user-table"><div style="padding:24px;color:var(--text-3)">Loading…</div></div></div>`;
  try {
    const data = await apiFetch('/api/admin/users');
    const users = data?.users || [];
    if (!users.length) { document.getElementById('user-table').innerHTML = '<div style="padding:24px;color:var(--text-3)">No users found</div>'; return; }
    const rows = users.map(u => `
      <tr>
        <td>${u.username}</td>
        <td style="color:var(--text-2)">${u.email}</td>
        <td><span class="role-badge role-${u.role.toLowerCase()}">${u.role}</span></td>
        <td><span class="badge badge-${u.status === 'ACTIVE' ? 'success' : 'danger'}">${u.status}</span></td>
        <td>${fmtDate(u.createdAt)}</td>
        <td>
          ${u.status === 'ACTIVE'
            ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:11px" data-action="suspend-user" data-id="${u.id}">Suspend</button>`
            : `<button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" data-action="activate-user" data-id="${u.id}">Activate</button>`}
        </td>
      </tr>`).join('');
    document.getElementById('user-table').innerHTML = `<table><thead><tr>
      <th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Action</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
    document.querySelectorAll('[data-action="suspend-user"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Suspend this user?')) return;
        try { await apiFetch(`/api/admin/users/${btn.dataset.id}/suspend`, { method: 'POST' }); renderUsers(); }
        catch (e) { alert(e.message); }
      });
    });
    document.querySelectorAll('[data-action="activate-user"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try { await apiFetch(`/api/admin/users/${btn.dataset.id}/activate`, { method: 'POST' }); renderUsers(); }
        catch (e) { alert(e.message); }
      });
    });
  } catch (e) {
    document.getElementById('user-table').innerHTML = `<div style="padding:16px;color:var(--text-3)">${e.message}</div>`;
  }
}

// ── Events View ────────────────────────────────────────────
async function renderEvents() {
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="panel"><div class="panel-header"><span class="panel-title">Security Audit Log</span></div><div id="ev-list"></div></div>`;

    const data = await apiFetch('/api/admin/events?limit=50');
    document.getElementById('ev-list').innerHTML = eventList(data?.events || [], true);

// ── Products View ──────────────────────────────────────────
async function renderProducts() {
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="panel"><div class="panel-header"><span class="panel-title">Products & Plans</span></div><div id="prod-list"><div style="padding:24px;color:var(--text-3)">Loading…</div></div></div>`;

  }
}

// ── Renderers map ──────────────────────────────────────────
const RENDERERS = {
  dashboard: renderDashboard,
  licenses: renderLicenses,
  generate: renderGenerate,
  users: renderUsers,
  events: renderEvents,
  products: renderProducts,
};

// ── Helpers ────────────────────────────────────────────────
const EVENT_COLORS = {
  LOGIN_SUCCESS: 'var(--success)', LOGIN_FAILURE: 'var(--danger)',
  LOGOUT: 'var(--text-3)', TOKEN_REFRESH: 'var(--info)',
  LICENSE_ACTIVATED: 'var(--accent)', LICENSE_REVOKED: 'var(--danger)',
  LICENSE_SUSPENDED: 'var(--warning)', DEVICE_BOUND: 'var(--info)',
  DEVICE_RESET: 'var(--warning)', REPLAY_DETECTED: 'var(--danger)',
  RATE_LIMITED: 'var(--warning)', ADMIN_ACTION: 'var(--accent)',
  ACCOUNT_SUSPENDED: 'var(--danger)',
};

function eventList(events, full = false) {
  if (!events.length) return '<div style="padding:24px;color:var(--text-3);text-align:center">No events</div>';
  return events.map(e => `
    <div class="event-item">
      <div class="event-dot" style="background:${EVENT_COLORS[e.type] || 'var(--text-3)'}"></div>
      <div class="event-body">
        <div class="event-msg">${formatEventType(e.type)}${e.user ? ` — <b>${e.user.username}</b>` : ''}</div>
        <div class="event-meta">${fmtDate(e.createdAt, true)}${full && e.metadata ? ' · ' + tryJson(e.metadata) : ''}</div>
      </div>
    </div>`).join('');
}

function formatEventType(t) {
  return (t || '').split('_').map(w => w[0] + w.slice(1).toLowerCase()).join(' ');
}

function tryJson(s) {
  try { const o = JSON.parse(s); return Object.entries(o).map(([k,v]) => `${k}: ${v}`).join(', '); }
  catch { return s; }
}

function statusColor(s) {
  return { ACTIVE: 'success', SUSPENDED: 'warning', REVOKED: 'danger', EXPIRED: 'warning' }[s] || 'info';
}

function fmt(n) { return (n ?? 0).toLocaleString(); }

function fmtDate(d, time = false) {
  if (!d) return '<span style="color:var(--text-3)">—</span>';
  const dt = new Date(d);
  if (isNaN(dt)) return '—';
  return time ? dt.toLocaleString() : dt.toLocaleDateString();
}

// ── Try restore session from localStorage ──────────────────
const savedToken = localStorage.getItem('immortal_admin_token');
if (savedToken) {
  accessToken = savedToken;
  fetch(`${API}/api/auth/me`, { headers: { Authorization: `Bearer ${savedToken}` } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(me => bootDashboard(me.username, me.role))
    .catch(() => { accessToken = ''; localStorage.removeItem('immortal_admin_token'); });
}
