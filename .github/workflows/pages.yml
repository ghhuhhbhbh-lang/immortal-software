name: Deploy portal

on:
  push:
    branches: [main, master]
    paths:
      - 'dashboard/**'
      - 'portal/**'
      - 'Emulator Loader GUI/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site
        run: |
          set -euo pipefail
          mkdir -p _site/admin _site/loader

          # Portal at site root
          cp -R portal/. _site/
          # Admin dashboard
          if [ -d dashboard ]; then cp -R dashboard/. _site/admin/; fi
          # Loader GUI
          if [ -d "Emulator Loader GUI" ]; then
            cp -R "Emulator Loader GUI/." _site/loader/
          fi

          # Drop local-only / tooling files from the published site
          rm -f _site/serve-local.js _site/set-gate-pass.cjs _site/set-gate-pass.mjs _site/README.md

          # Point SPA helpers at public paths
          cat > _site/config.js <<'EOF'
(function (w) {
  var host = (typeof location !== 'undefined' && location.hostname) || '';
  var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '' || host === 'immortal.loader';
  // Static GitHub Pages has no API — keep local API only for localhost
  w.IMMORTAL_API = w.IMMORTAL_API || (isLocal ? 'http://127.0.0.1:3000' : '');
  w.IMMORTAL_LOADER = w.IMMORTAL_LOADER || new URL('loader/', location.href).href;
  w.IMMORTAL_ADMIN = w.IMMORTAL_ADMIN || new URL('admin/', location.href).href;
})(window);
EOF

          echo "immortal-static 2.3.1 $(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/VERSION.txt
          ls -la _site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
