name: Deploy portal

on:
  push:
    branches: [main, master]
    paths:
      - 'dashboard/**'
      - 'portal/**'
      - 'Emulator Loader GUI/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage portal
        run: |
          mkdir -p _site
          cp -R dashboard/. _site/admin/
          mkdir -p _site/portal
          cp -R portal/. _site/portal/
          cp portal/index.html _site/index.html
          if [ -d "Emulator Loader GUI" ]; then
            mkdir -p "_site/Emulator Loader GUI"
            cp -R "Emulator Loader GUI/." "_site/Emulator Loader GUI/" 2>/dev/null || true
          fi
          # Pages is static — point portal at same-origin paths
          sed -i 's|../Emulator Loader GUI/index.html|../Emulator%20Loader%20GUI/index.html|g' _site/portal/config.js || true
          # Stamp UI version for cache-bust awareness in static hosts
          echo "immortal-static 2.3.1 $(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/VERSION.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
