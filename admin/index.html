// â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function defaultApiBase() {
  const fromCfg = String(window.IMMORTAL_API || '').replace(/\/$/, '');
  if (fromCfg) return fromCfg;
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1') return 'https://liquid-workflow-surgical-liz.trycloudflare.com';
  return 'https://liquid-workflow-surgical-liz.trycloudflare.com';
}
function normalizeApiBase(raw) {
  let v = String(raw || '').trim().replace(/\/$/, '');
  if (!v) v = defaultApiBase();
  try {
    const u = new URL(v);
    const host = u.hostname;
    const okLocal = host === 'localhost' || host === '127.0.0.1';
    const okHost = okLocal || host.includes('.');
    if (!okHost || (u.protocol !== 'http:' && u.protocol !== 'https:')) {
      throw new Error('bad');
    }
    return v;
  } catch {
    throw new Error('API Endpoint invalid');
  }
}
let API = defaultApiBase();
document.getElementById('api-url-input').value = API;
let accessToken = '';
let currentView = 'dashboard';
let cache = {};

// Auth helpers
async function apiFetch(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${accessToken}`,
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) { doLogout(); return null; }
  const text = await r.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch {
    throw new Error('API returned an unexpected response');
  }
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// Login — username + password only
document.getElementById('login-submit').addEventListener('click', async () => {
  const btn = document.getElementById('login-submit');
  const err = document.getElementById('login-err');
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  err.textContent = '';
  if (!user || !pass) { err.textContent = 'Enter credentials'; return; }
  try {
    API = normalizeApiBase(document.getElementById('api-url-input').value);
    document.getElementById('api-url-input').value = API;
  } catch (e) {
    err.textContent = e.message;
    return;
  }
  btn.textContent = 'CONNECTING…'; btn.disabled = true;
  try {
    const fp = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('');
    const r = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: user,
        password: pass,
        fingerprint: fp,
        nonce: crypto.randomUUID(),
        timestamp: Math.floor(Date.now() / 1000),
      }),
    });
    const text = await r.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; }
    catch {
      throw new Error('API returned an unexpected response');
    }
    if (!r.ok || !data.accessToken) throw new Error(data.error || 'Login failed');
    accessToken = data.accessToken;
    localStorage.setItem('immortal_admin_token', accessToken);
    bootDashboard(user, data.role || 'ADMIN');
  } catch (e) {
    err.textContent = e.message === 'Failed to fetch'
      ? 'Cannot reach server — try again'
      : e.message;
    btn.textContent = 'ENTER DASHBOARD'; btn.disabled = false;
  }
});

// Allow Enter key to submit
['login-user', 'login-pass'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-submit').click();

);

function bootDashboard(username, role) {
  document.getElementById('login-screen').classList.add('hidden');
  const shell = document.getElementById('app-shell');
  shell.classList.remove('hidden');
  shell.style.display = 'flex';
  document.getElementById('sidebar-name').textContent = username;
  document.getElementById('sidebar-avatar').textContent = username[0].toUpperCase();
  document.getElementById('sidebar-role').textContent = role;
  navigateTo('dashboard');
  pingApi();
  setInterval(pingApi, 60000);
}

async function pingApi() {
  const dot = document.getElementById('api-dot');
  const txt = document.getElementById('api-status-txt');
  try {
    const r = await fetch(`${API}/health`);
    const data = await r.json().catch(() => ({}));
    const degraded = data.status === 'degraded' || data.db === 'down';
    if (!r.ok || degraded) {
      dot.style.background = 'var(--warning)';
      dot.style.boxShadow = '0 0 6px var(--warning)';
      txt.textContent = data.version ? `DB? Â· ${data.version}` : 'Degraded';
      return;
    }
    dot.style.background = 'var(--success)';
    dot.style.boxShadow = '0 0 6px var(--success)';
    txt.textContent = data.version ? `Live Â· ${data.version}` : 'Live';
  } catch {
    dot.style.background = 'var(--danger)';
    dot.style.boxShadow = '0 0 6px var(--danger)';
    txt.textContent = 'Offline';
  }
}

function doLogout() {
  apiFetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
  accessToken = '';
  localStorage.removeItem('immortal_admin_token');
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').textContent = '';
}

  RENDERERS[view]?.();

    attachLicenseActions();
  } catch (e) {

  }
}

function licenseTable(licenses, full = false) {
  if (!licenses.length) return '<div style="padding:24px;color:var(--text-3);text-align:center">No licenses found</div>';
  const rows = licenses.map(l => `
    <tr>
      <td><span style="font-family:monospace;font-size:12px;color:var(--accent)">${l.keyPrefix || '????'}â€‘â€¢â€¢â€¢â€¢â€‘â€¢â€¢â€¢â€¢â€‘â€¢â€¢â€¢â€¢â€‘â€¢â€¢â€¢â€¢</span></td>
      <td><span class="badge badge-${statusColor(l.status)}">${l.status}</span></td>
      <td>${(typeof l.product === 'string' ? l.product : l.product?.name) || 'â€”'}</td>
      <td>${(typeof l.plan === 'string' ? l.plan : l.plan?.name) || 'â€”'}</td>
      <td>${l.holder?.username || '<span style="color:var(--text-3)">Unbound</span>'}</td>
      <td>${fmtDate(l.expiresAt || l.expirationDate)}</td>
      ${full ? `<td><div style="display:flex;gap:6px">
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" data-action="reset-devices" data-id="${l.id}">Reset Devices</button>
        <button class="btn btn-danger" style="padding:4px 10px;font-size:11px" data-action="revoke" data-id="${l.id}">Revoke</button>
      </div></td>` : ''}
    </tr>`).join('');
  return `<table><thead><tr>
    <th>Key</th><th>Status</th><th>Product</th><th>Plan</th><th>Holder</th><th>Expires</th>
    ${full ? '<th>Actions</th>' : ''}
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function attachLicenseActions() {
  document.querySelectorAll('[data-action="revoke"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Revoke this license?')) return;
      try {
        await apiFetch(`/api/licenses/${btn.dataset.id}/revoke`, { method: 'POST' });
        cache = {}; renderLicenses();
      } catch (e) { alert(e.message); }
    });
  });
  document.querySelectorAll('[data-action="reset-devices"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await apiFetch(`/api/licenses/${btn.dataset.id}/reset-devices`, { method: 'POST' });
        alert('Devices reset successfully');
      } catch (e) { alert(e.message); }
    });
  });
}

let _thrPage = 1;

async function loadThreats(page) {
  _thrPage = page || 1;
  const tableEl = document.getElementById('thr-table');
  const pagEl   = document.getElementById('thr-pagination');
  const countLbl= document.getElementById('thr-count-lbl');
  if (!tableEl) return;
  tableEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3)">Loadingâ€¦</div>';

  const sev  = document.getElementById('thr-sev')?.value || '';
  const type = document.getElementById('thr-type')?.value.trim() || '';
  let qs = `?page=${_thrPage}&limit=20`;
  if (sev)  qs += `&severity=${encodeURIComponent(sev)}`;
  if (type) qs += `&type=${encodeURIComponent(type)}`;

  try {
    const data = await apiFetch(`/api/security/events${qs}`);
    if (!data) return;
    const { events, total, limit } = data;
    const totalPages = Math.ceil(total / (limit || 20));

    // Update nav badge on first load.
    const badge = document.getElementById('nav-badge-threat');
    if (badge && !sev && !type) badge.textContent = total || 0;
    if (countLbl) countLbl.textContent = `${total.toLocaleString()} total events`;

    if (!events.length) {
      tableEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3)">No events match the current filter</div>';
      if (pagEl) pagEl.innerHTML = '';
      return;
    }

    tableEl.innerHTML = events.map(ev => {
      let meta = {};
      try { meta = JSON.parse(ev.metadata || '{}'); } catch {}
      const sev   = meta.severity || 'INFO';
      const cols  = THREAT_SEVERITY_COLORS[sev] || THREAT_SEVERITY_COLORS.INFO;
      const reason= meta.reason || 'â€”';
      const ver   = meta.loaderVersion || 'â€”';
      const fp    = (meta.fingerprint || '').slice(0, 16) || 'â€”';
      const action= meta.revoke ? 'REVOKED' : ev.actionTaken || 'LOGGED';

      return `
      <div style="border-bottom:1px solid var(--border-2);padding:16px 20px;background:${cols.bg};border-left:3px solid ${cols.border}">
        <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
              <span style="background:${cols.badge};color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;letter-spacing:.07em">${sev}</span>
              <span style="font-family:monospace;font-weight:700;color:var(--text-1);font-size:13px">${ev.type}</span>
            </div>
            <div style="color:var(--text-2);font-size:12.5px;margin-bottom:4px">ðŸ“‹ ${reason}</div>
            <div style="color:var(--text-3);font-size:11.5px">Loader v${ver} Â· Device: <code style="font-size:10px;background:var(--surface-2);padding:1px 4px;border-radius:4px">${fp}</code></div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">${fmtDate(ev.createdAt, true)}</div>
            <div style="font-size:11.5px;color:var(--text-2)">User: ${ev.user?.username || ev.userId?.slice(0, 8) + 'â€¦' || 'â€”'}</div>
            <div style="font-size:11.5px;color:var(--text-2)">License: ${ev.license?.keyPrefix || 'â€”'}</div>
            <div style="margin-top:8px">
              <span style="background:${meta.revoke ? 'rgba(239,68,68,.15)' : 'rgba(99,102,241,.1)'};color:${meta.revoke ? '#ef4444' : '#818cf8'};font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;letter-spacing:.06em">${action}</span>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');

    // Pagination.
    if (pagEl) {
      let pages = '';
      for (let i = 1; i <= Math.min(totalPages, 10); i++) {
        pages += `<button onclick="loadThreats(${i})"
          style="background:${i === _thrPage ? 'linear-gradient(135deg,#8B5CF6,#6D28D9)' : 'var(--surface-2)'};color:${i === _thrPage ? '#fff' : 'var(--text-1)'};border:1.5px solid ${i === _thrPage ? 'transparent' : 'var(--border-2)'};border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer">${i}</button>`;
      }
      pagEl.innerHTML = pages;
    }
  } catch (e) {
    tableEl.innerHTML = `<div style="padding:24px;color:var(--danger)">${e.message}</div>`;
  }
}

let _selectedDllFile = null;

function selectDllFile(file) {
  _selectedDllFile = file;
  const nameEl = document.getElementById('upd-file-name');
  const wrapEl = document.getElementById('upd-file-name-wrap');
  if (nameEl) {
    nameEl.textContent = `${file.name}  (${(file.size/1024/1024).toFixed(2)} MB)`;
  }
  if (wrapEl) wrapEl.style.display = 'block';
  const btn = document.getElementById('upd-upload-btn');
  if (btn) btn.disabled = false;
  const dz = document.getElementById('drop-zone');
  if (dz) { dz.style.borderColor = '#8B5CF6'; dz.style.background = 'rgba(139,92,246,.06)'; }
}

function handleDllDrop(event) {
  event.preventDefault();
  const dz = document.getElementById('drop-zone');
  dz.style.borderColor = '';
  dz.style.background  = 'var(--surface-2)';
  const file = event.dataTransfer.files[0];
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.dll')) {
    setUploadStatus('Only .dll files are accepted', 'var(--danger)');
    return;
  }
  selectDllFile(file);
}

function setUploadStatus(msg, color) {
  const el = document.getElementById('upd-upload-status');
  if (el) { el.textContent = msg; el.style.color = color || 'var(--text-3)'; }
}

async function doUpload() {
  if (!_selectedDllFile) return;
  const ver = (document.getElementById('upd-version')?.value || '').trim();
  if (!/^\d+\.\d+\.\d+$/.test(ver)) {
    setUploadStatus('Enter a valid semver version (e.g. 2.2.0)', 'var(--danger)');
    return;
  }

  const btn = document.getElementById('upd-upload-btn');
  btn.disabled = true;
  btn.textContent = 'UPLOADINGâ€¦';

  const progressWrap = document.getElementById('upd-progress-wrap');
  const progressBar  = document.getElementById('upd-progress-bar');
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';

  setUploadStatus('Uploadingâ€¦', 'var(--text-2)');

  const fd = new FormData();
  fd.append('file', _selectedDllFile);
  fd.append('version', ver);

  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${API}/api/update/admin/upload`);
    xhr.setRequestHeader('Authorization', `Bearer ${accessToken}`);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) progressBar.style.width = `${Math.round(e.loaded/e.total*90)}%`;
    };
    await new Promise((resolve, reject) => {
      xhr.onload  = () => resolve(xhr);
      xhr.onerror = () => reject(new Error('Network error'));
      xhr.send(fd);
    });
    progressBar.style.width = '100%';
    if (xhr.status === 201) {
      const resp = JSON.parse(xhr.responseText);
      setUploadStatus(`âœ“ Uploaded v${resp.version}  Â·  SHA-256: ${resp.sha256}`, 'var(--success)');
      _selectedDllFile = null;
      document.getElementById('upd-version').value = '';
      document.getElementById('upd-file-name').textContent = 'No file selected';
      document.getElementById('dll-file-input').value = '';
      btn.textContent = 'UPLOAD DLL';
      await loadVersions();
    } else {
      const err = JSON.parse(xhr.responseText);
      setUploadStatus(`Error: ${err.error || xhr.status}`, 'var(--danger)');
      btn.disabled = false;
      btn.textContent = 'UPLOAD DLL';
    }
  } catch (e) {
    setUploadStatus(`Upload failed: ${e.message}`, 'var(--danger)');
    btn.disabled = false;
    btn.textContent = 'UPLOAD DLL';
  }
  setTimeout(() => { progressWrap.style.display = 'none'; }, 1500);
}

async function doSetLive(version) {
  try {
    await apiFetch(`/api/update/admin/set-live/${encodeURIComponent(version)}`, { method: 'POST' });
    setUploadStatus(`âœ“ v${version} is now LIVE`, 'var(--success)');
    await loadVersions();
  } catch (e) {
    setUploadStatus(`Error: ${e.message}`, 'var(--danger)');
  }
}

async function doDeleteVersion(version) {
  if (!confirm(`Delete version ${version}? This is permanent.`)) return;
  try {
    await apiFetch(`/api/update/admin/versions/${encodeURIComponent(version)}`, { method: 'DELETE' });
    await loadVersions();
  } catch (e) {
    setUploadStatus(`Error: ${e.message}`, 'var(--danger)');
  }
}

async function loadVersions() {
  const tableEl = document.getElementById('upd-table');
  const chipEl  = document.getElementById('upd-live-chip');
  if (!tableEl) return;
  tableEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3)">Loadingâ€¦</div>';
  try {
    const data = await apiFetch('/api/update/admin/versions');
    if (!data) return;
    const { live, versions } = data;

    // Update badge
    const badge = document.getElementById('nav-badge-upd');
    if (badge) badge.textContent = versions.length || 0;

    // Live chip in panel header
    if (chipEl) {
      chipEl.style.display = live ? 'inline-block' : 'none';
      chipEl.textContent = live ? `LIVE: v${live}` : '';
    }

    if (!versions.length) {
      tableEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3)">No versions uploaded yet</div>';
      return;
    }

    tableEl.innerHTML = `
    <table class="tbl" style="width:100%">
      <thead><tr>
        <th>Version</th>
        <th>SHA-256</th>
        <th>Size</th>
        <th>Uploaded</th>
        <th>By</th>
        <th>Status</th>
        <th style="text-align:right">Actions</th>
      </tr></thead>
      <tbody>
        ${versions.map(v => `
        <tr>
          <td style="font-family:monospace;font-weight:700;color:var(--text-1)">
            v${v.version}
            ${v.live ? '<span style="margin-left:6px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;letter-spacing:.07em">LIVE</span>' : ''}
          </td>
          <td style="font-family:monospace;font-size:11px;color:var(--text-3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${v.sha256}">${v.sha256}</td>
          <td style="color:var(--text-2);font-size:12.5px">${v.sizeBytes ? (v.sizeBytes/1024/1024).toFixed(2)+' MB' : 'â€”'}</td>
          <td style="color:var(--text-2);font-size:12px">${fmtDate(v.uploadedAt, true)}</td>
          <td style="color:var(--text-2);font-size:12px">${v.uploadedBy || 'â€”'}</td>
          <td><span class="badge badge-${v.live ? 'success' : 'warning'}">${v.live ? 'Live' : 'Staged'}</span></td>
          <td style="text-align:right;white-space:nowrap">
            ${!v.live ? `<button onclick="doSetLive('${v.version}')"
              style="background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;border:none;border-radius:7px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-right:6px;letter-spacing:.04em">Set Live</button>` : ''}
            ${!v.live ? `<button onclick="doDeleteVersion('${v.version}')"
              style="background:transparent;color:var(--danger);border:1.5px solid var(--danger);border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer">Delete</button>` : ''}
            ${v.live ? '<span style="color:var(--text-3);font-size:12px">Protected</span>' : ''}
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  } catch (e) {
    tableEl.innerHTML = `<div style="padding:24px;color:var(--danger)">${e.message}</div>`;
  }
}

// â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const EVENT_COLORS = {
  LOGIN_SUCCESS: 'var(--success)', LOGIN_FAILURE: 'var(--danger)',
  LOGOUT: 'var(--text-3)', TOKEN_REFRESH: 'var(--info)',
  LICENSE_ACTIVATED: 'var(--accent)', LICENSE_REVOKED: 'var(--danger)',
  LICENSE_SUSPENDED: 'var(--warning)', DEVICE_BOUND: 'var(--info)',
  DEVICE_RESET: 'var(--warning)', REPLAY_DETECTED: 'var(--danger)',
  RATE_LIMITED: 'var(--warning)', ADMIN_ACTION: 'var(--accent)',
  ACCOUNT_SUSPENDED: 'var(--danger)',
};

function eventList(events, full = false) {
  if (!events.length) return '<div style="padding:24px;color:var(--text-3);text-align:center">No events</div>';
  return events.map(e => `
    <div class="event-item">
      <div class="event-dot" style="background:${EVENT_COLORS[e.type || e.eventType] || 'var(--text-3)'}"></div>
      <div class="event-body">
        <div class="event-msg">${formatEventType(e.type || e.eventType)}${e.user ? ` â€” <b>${e.user.username}</b>` : ''}</div>
        <div class="event-meta">${fmtDate(e.createdAt, true)}${full && e.metadata ? ' Â· ' + tryJson(e.metadata) : ''}</div>
      </div>
    </div>`).join('');
}

function formatEventType(t) {
  return (t || '').split('_').map(w => w[0] + w.slice(1).toLowerCase()).join(' ');
}

function tryJson(s) {
  try { const o = JSON.parse(s); return Object.entries(o).map(([k,v]) => `${k}: ${v}`).join(', '); }
  catch { return s; }
}

function statusColor(s) {
  return { ACTIVE: 'success', SUSPENDED: 'warning', REVOKED: 'danger', EXPIRED: 'warning' }[s] || 'info';
}

function fmt(n) { return (n ?? 0).toLocaleString(); }

function fmtDate(d, time = false) {
  if (!d) return '<span style="color:var(--text-3)">â€”</span>';
  const dt = new Date(d);
  if (isNaN(dt)) return 'â€”';
  return time ? dt.toLocaleString() : dt.toLocaleDateString();
}

const savedToken = localStorage.getItem('immortal_admin_token');
if (savedToken) {
  accessToken = savedToken;
  fetch(`${API}/api/auth/me`, { headers: { Authorization: `Bearer ${savedToken}` } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(me => bootDashboard(me.username || me.user?.username || 'admin', me.role || me.user?.role || 'ADMIN'))
    .catch(() => { accessToken = ''; localStorage.removeItem('immortal_admin_token'); });
}
